<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechParts</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="parent">
        <div class="grid-login">
            <div class="logo">
                <img src="assets/IMG/logo sem fundo.png" alt="Logo da empresa">

                <div class="login-logo-text">
                    <h1>Bem-vindo a TechParts</h1>
                    <p>Faça login para continuar</p>
                </div>

                <h2>Bem-Vindo de Volta!</h2>
                <p>Por favor, insira suas credenciais para acessar sua conta.</p>
            </div>

            <form action="login.php" method="POST" class="login-form">
                <input type="text" name="username" placeholder="Usuário" class="input-login">
                <input type="password" name="password" placeholder="Senha" class="input-login">
                <button type="submit" class="login-button" link="dashboard.html">Entrar</button>
            </form>


            <div class="login-login-footer">
                <p>Não tem uma conta? <a href="pages/cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
</body>

</html>
