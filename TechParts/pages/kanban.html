<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kanban - TechParts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/kanban.css">
</head>

<body>
    <div id="Navbar" class="black"></div>
    <script src="../assets/js/navbar.js"></script>

    <h2 class="titulo">
        Kanban - Organize suas tarefas de forma eficiente
    </h2>

    <div class="divider-flex">Clique na tarefa para ver detalhes</div>

    <div class="container">
        <div class="kanban-board">
            <div class="kanban-block" id="todo" ondrop="drop(event)" ondragover="allowDrop(event)">
                <strong>A fazer</strong>
                <div class="task-button-block">
                    <button id="task-button" onclick="createTask()">Criar Nova Tarefa</button>
                </div>
                <div class="task" id="task1" draggable="true" ondragstart="drag(event)"
                    onclick="showTaskDescription(this)" data-name="Tarefa 1" data-description="Descrição da Tarefa 1.">
                    <span>Tarefa 1</span>
                </div>
                <div class="task" id="task2" draggable="true" ondragstart="drag(event)"
                    onclick="showTaskDescription(this)" data-name="Tarefa 2" data-description="Descrição da Tarefa 2.">
                    <span>Tarefa 2</span>
                </div>
                <div class="task" id="task3" draggable="true" ondragstart="drag(event)"
                    onclick="showTaskDescription(this)" data-name="Tarefa 3" data-description="Descrição da Tarefa 3.">
                    <span>Tarefa 3</span>
                </div>
            </div>
            <div class="kanban-block" id="inprogress" ondrop="drop(event)" ondragover="allowDrop(event)">
                <strong>Em Progresso</strong>
            </div>
            <div class="kanban-block" id="done" ondrop="drop(event)" ondragover="allowDrop(event)">
                <strong>Feito</strong>
            </div>

            <div class="create-new-task-block" id="create-new-task-block">
                <strong>Nova Tarefa:</strong>
                <span class="form-row">
                    <label class="form-row-label" for="task-name">Nome da Tarefa:</label>
                    <input class="form-row-input" type="text" name="task-name" id="task-name">
                </span>
                <span class="form-row">
                    <label class="form-row-label" for="task-description">Descrição</label>
                    <textarea class="form-row-input" name="task-description" id="task-description" cols="70"
                        rows="10"></textarea>
                </span>
                <span class="form-row-buttons">
                    <button id="edit-button" onclick="editTask()">Editar</button>
                    <button id="save-button" onclick="saveTask()">Salvar</button>
                    <button id="cancel-button" onclick="createTask()">Cancelar</button>
                </span>
            </div>
        </div>
    </div>

    <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskModalLabel">Tarefa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="taskModalDescription"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="taskModalDeleteButton"
                        onclick="deleteTask()">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/kanban.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
