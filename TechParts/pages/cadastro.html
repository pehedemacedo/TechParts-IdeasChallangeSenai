<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechParts - Industria</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body> 
    <div class="parent">
        <div class="grid-login">
            <div class="logo">
                <img src="logo.png" alt="Logo da empresa">
            
                <div class="login-logo-text">
                    <h1>Criar Conta</h1>
                    <p>Preencha os campos abaixo para criar sua conta</p>
                </div>
            </div>

            <form action="login.php" method="POST" class="login-form">
                <input type="text" name="name" placeholder="Nome Completo" class="input-login">
                <input type="text" name="cpf" placeholder="CPF" class="input-login">
                <input type="text" name="username" placeholder="Usuário" class="input-login">
                <input type="password" name="password" placeholder="Senha" class="input-login">
                <button type="submit" class="login-button">Criar Conta</button>
            </form>

            <div class="login-login-footer">
                <p><a href="../index.html">Já tenho uma conta</a></p>
            </div>
    </div>
</body>
</html>
