<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamadas de Manutenção - TechParts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/chamadas.css">
</head>

<body>
    <script src="../assets/js/theme.js"></script>

    <div id="Navbar"></div>
    <script src="../assets/js/navbar.js"></script>

    <h1>Chamadas de Manutenção</h1>
    <p>Aqui você pode gerenciar suas chamadas de manutenção.</p>

    <a href="#" class="login-button" onclick="openModal(); return false;">Nova Chamada</a>

    <input type="text" id="searchInput" placeholder="Pesquisar por cliente, Máquina ou Status" onkeyup="searchTable()">

    <select id="statusFilter" onchange="filterTable()">
        <option value="">Todos os Status</option>
        <option value="Aberto">Aberto</option>
        <option value="Em Andamento">Em Andamento</option>
        <option value="Concluído">Concluído</option>
    </select>

    <select id="priorityFilter" onchange="filterTable()">
        <option value="">Todas as Prioridades</option>
        <option value="Alta">Alta</option>
        <option value="Média">Média</option>
        <option value="Baixa">Baixa</option>
    </select>

    <table id="chamadasTable">
        <thead>
            <tr>
                <th>chamada</th>
                <th>setor</th>
                <th>prioridade</th>
                <th>responsavel</th>
                <th>status</th>
                <th>data</th>
            </tr>
        </thead>
    </table>

    <div id="chamadaModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2>Nova Chamada de Manutenção</h2>

            <form id="addChamadaForm" onsubmit="addChamada(event)">
                <div class="form-group">
                    <label for="modalChamada">Descrição da Chamada</label>
                    <input type="text" id="modalChamada" required placeholder="Ex: Torno CNC parado">
                </div>

                <div class="form-group">
                    <label for="modalSetor">Setor</label>
                    <input type="text" id="modalSetor" required placeholder="Ex: Usinagem">
                </div>

                <div class="form-group">
                    <label for="modalPrioridade">Prioridade</label>
                    <select id="modalPrioridade" required>
                        <option value="Alta">Alta</option>
                        <option value="Média" selected>Média</option>
                        <option value="Baixa">Baixa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="modalResponsavel">Responsável</label>
                    <input type="text" id="modalResponsavel" required placeholder="Ex: Carlos Santos">
                </div>

                <div class="form-group">
                    <label for="modalStatus">Status</label>
                    <select id="modalStatus" required>
                        <option value="Aberto">Aberto</option>
                        <option value="Em Andamento">Em Andamento</option>
                        <option value="Concluído">Concluído</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="modalData">Data</label>
                    <input type="date" id="modalData" required>
                </div>

                <button type="submit" class="save-button">Salvar Chamada</button>
            </form>
        </div>
    </div>

    <script src="../assets/js/chamadas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
